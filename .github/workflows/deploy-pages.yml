name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'quiz/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish only the quiz/ folder, so the site lives at the domain root
      # (https://vcherchu.github.io/quiz/) rather than under /quiz/quiz/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./quiz

      - id: deployment
        uses: actions/deploy-pages@v4
